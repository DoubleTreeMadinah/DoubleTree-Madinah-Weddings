<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09194E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wedding Estimate | DoubleTree by Hilton Madinah Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,500;0,600;0,700;1,500&family=Archivo:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#09194E; --blue-2:#13286F; --green:#E5F0CB; --green-soft:#F4F8E9; --green-line:#C5D8A0;
  --grey:#939598; --white:#FFFFFF; --bg:#FAFAF7; --ink:#14193A; --muted:#566079; --line:#DDE0E8; --line-2:#EEF0F4;
  --r:12px; --bar:64px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
html[lang=en] body{font-family:'Trade Gothic LT Std','Archivo',Arial,sans-serif}
html[lang=ar] body{font-family:'Noto Kufi Arabic','Sakkal Majalla',Tahoma,sans-serif}
html[lang=en] .head{font-family:'Stag LCG','Zilla Slab',Georgia,serif}
html[lang=ar] .head{font-family:'Swissra',Tahoma,'Noto Kufi Arabic',sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select{font:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid #6C8FE8;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,64px)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:16px;transition:background .18s,border-color .18s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-2)}
.btn-secondary{background:var(--green);color:var(--blue);border-color:var(--green-line)}
.btn-secondary:hover{background:#d9e8b8}
.btn-text{background:transparent;color:var(--blue);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 12px;font-size:14px;font-weight:600}
.btn-block{width:100%}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid var(--green-line);background:var(--green);color:var(--blue);transition:background .18s}
.pill:hover{background:#d9e8b8}
.added{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--green);color:var(--blue);font-weight:600;font-size:14px;border:2px solid var(--blue)}
.link-sm{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;min-height:44px;padding:0 8px}

/* ---------- sticky bar ---------- */
#bar{position:sticky;top:0;z-index:30;background:var(--blue);color:#fff}
.bar-in{height:var(--bar);display:flex;align-items:center;gap:20px}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:#C9D0E8;min-height:var(--bar);padding:0 11px;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px}
.tab:hover{color:#fff}
.tab.cur{color:#fff;font-weight:600;border-bottom-color:var(--green)}
.tab .ck{color:var(--green);font-size:12px}
.mprog{display:none;flex:1;min-width:0;font-size:13px;font-weight:600;letter-spacing:.3px}
.lang{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;font-size:14px;font-weight:500}
.lang:hover{background:rgba(255,255,255,.1)}
.pbar{height:3px;background:rgba(255,255,255,.18)}
.pbar i{display:block;height:3px;background:var(--green);width:0;transition:width .35s}

/* ---------- hero ---------- */
.hero{background:var(--blue);color:#fff;overflow:hidden}
.hero-in{display:flex;min-height:600px}
.hero-copy{flex:0 0 52%;padding:56px clamp(16px,4vw,64px) 64px;padding-inline-start:max(clamp(16px,4vw,64px),calc((100vw - 1280px)/2 + clamp(16px,4vw,64px)));display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.hero-logo{width:150px;height:auto;margin-bottom:34px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;color:var(--green)}
html[lang=ar] .eyebrow{letter-spacing:0;font-size:14px;text-transform:none}
.hero h1{margin:18px 0 0;font-weight:700;font-size:clamp(40px,5vw,68px);line-height:1.08;color:var(--green);letter-spacing:-.4px}
html[lang=ar] .hero h1{line-height:1.3;letter-spacing:0}
.hero .tag{margin-top:18px;font-size:clamp(18px,2vw,24px);font-style:italic;color:#fff}
html[lang=ar] .hero .tag{font-style:normal}
.hero .desc{margin:18px 0 0;max-width:480px;color:#D8DCEA;font-size:17px}
.hero .btn{margin-top:30px;min-height:54px;padding:0 36px}
.hero-img{flex:1;position:relative;min-height:320px;background:#1b1b1b}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 30%}
.hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,var(--blue) 0%,rgba(9,25,78,0) 30%)}
html[dir=rtl] .hero-img::after{background:linear-gradient(to left,var(--blue) 0%,rgba(9,25,78,0) 30%)}

/* ---------- layout ---------- */
.note{display:flex;gap:12px;align-items:flex-start;margin:20px 0 0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--muted)}
.note b{color:var(--blue)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:40px;align-items:start;margin:28px 0 56px}
#aside{position:sticky;top:calc(var(--bar) + 20px);max-height:calc(100vh - var(--bar) - 40px);overflow:auto;border-radius:var(--r)}
.col{display:flex;flex-direction:column;gap:18px}

/* ---------- sections ---------- */
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:calc(var(--bar) + 16px)}
.sec-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;background:none;border:0;padding:22px 28px;text-align:start;min-height:72px}
.sec-t{display:flex;align-items:baseline;gap:14px;min-width:0}
.sec-n{font-size:13px;font-weight:600;letter-spacing:2px;color:var(--grey)}
.sec-t h2{margin:0;font-size:clamp(22px,2.4vw,30px);font-weight:600;color:var(--blue);line-height:1.2}
.sec-s .tx{white-space:nowrap}
.sec-s{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);text-align:end}
.sec-s .chev{transition:transform .25s;color:var(--blue)}
.sec.open .chev{transform:rotate(180deg)}
.sec-s .done{background:var(--green);color:var(--blue);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.sec-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.sec.open .sec-b{grid-template-rows:1fr}
.sec-b>div{overflow:hidden;min-height:0}
.sec-body{padding:4px 28px 28px;display:flex;flex-direction:column;gap:18px}

/* ---------- fields ---------- */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fld label,.lbl{display:block;font-size:14px;font-weight:600;color:var(--blue);margin-bottom:8px}
.lbl small,.fld small{font-weight:400;color:var(--muted)}
.inp{display:flex;align-items:center;gap:10px;border:1px solid #8a90a3;border-radius:8px;min-height:52px;padding:0 14px;background:#fff;color:var(--blue)}
.inp input{border:0;outline:0;background:transparent;flex:1;min-width:0;width:auto;min-height:50px;font-size:16px;color:var(--ink)}
.inp:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(9,25,78,.15)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .v{min-width:44px;text-align:center;font-weight:700;font-size:18px;color:var(--blue)}
.sbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--blue);background:#fff;color:var(--blue);display:inline-flex;align-items:center;justify-content:center;flex:none}
.sbtn.pl{background:var(--blue);color:#fff}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted)}

/* ---------- cards ---------- */
.featured{border:1px solid var(--line);border-radius:var(--r);padding:26px;background:#fff;transition:border-color .2s}
.featured.on{border:2px solid var(--blue);padding:25px}
.f-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.badge{display:inline-block;background:var(--green);color:var(--blue);font-size:12px;font-weight:700;border-radius:999px;padding:3px 12px;margin-bottom:10px}
.featured h3,.compact h3{margin:0;color:var(--blue);font-weight:600;line-height:1.25}
.featured h3{font-size:clamp(22px,2.4vw,28px)}
.featured p,.compact p{margin:6px 0 0;color:#3E4560;font-size:15px}
.price{font-weight:700;color:var(--blue);font-size:22px;white-space:nowrap}
.price small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink)}
.f-act{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:14px}
.details{display:none;margin-top:12px;font-size:14px;line-height:1.8;color:#3E4560;background:var(--green-soft);border-radius:10px;padding:14px 16px}
.details.show{display:block}
.sub{border-top:1px solid var(--line);margin-top:16px;padding-top:18px}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.radio{position:relative}
.radio input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.radio>input+span{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 18px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
.radio>input+span::before{content:"";width:18px;height:18px;border-radius:50%;border:1.5px solid var(--grey);flex:none}
.radio input:checked+span{border:2px solid var(--blue);background:var(--green);font-weight:600;color:var(--blue)}
.radio input:checked+span::before{border:5px solid var(--blue);background:#fff}
.radio input:focus-visible+span{outline:3px solid #6C8FE8;outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.compact{border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:6px;background:#fff;transition:border-color .2s}
.compact.on{border:2px solid var(--blue);padding:19px}
.compact h3{font-size:17px}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.c-foot .price{font-size:17px}
.c-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tiers{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tier{min-height:44px;border:1px solid #8a90a3;background:#fff;border-radius:8px;padding:0 14px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;color:var(--ink)}
.tier b{font-size:13px;color:var(--blue)}
.tier.sel{border:2px solid var(--blue);background:var(--green);font-weight:600}
.tier .rec{font-size:11px;color:var(--muted);font-weight:500}
.benefit{background:var(--green-soft);border:1px solid var(--green-line);border-radius:12px;padding:22px 24px}
.benefit h3{margin:0;font-size:20px;color:var(--blue);font-weight:600}
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;margin:14px 0 0;padding:0;list-style:none;font-size:15px}
.checks li::before{content:"✓";color:var(--blue);font-weight:700;margin-inline-end:8px}
.group-t{font-size:15px;font-weight:700;color:var(--blue);margin:6px 0 0}
.bevchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bchip{min-height:44px;border:1px solid #8a90a3;background:#fff;border-radius:999px;padding:0 18px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.bchip[aria-pressed=true]{background:var(--green);border:2px solid var(--blue);color:var(--blue);font-weight:600}
.inc-row{display:flex;gap:14px;align-items:flex-start}
.inc-row .ic{width:36px;height:36px;border-radius:50%;background:var(--green);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.acc{border:1px solid var(--line);border-radius:10px}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;min-height:56px;padding:0 20px;font-weight:600;color:var(--blue);font-size:16px}
.acc .chev{transition:transform .25s}
.acc.open .chev{transform:rotate(180deg)}
.acc .acc-b{display:none;padding:0 20px 20px}
.acc.open .acc-b{display:block}

/* ---------- estimate ---------- */
.est{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px}
.est h2{margin:0;font-size:24px;color:var(--blue);font-weight:600}
.est .g{color:var(--muted);font-size:15px;margin-top:4px}
.est .k{margin-top:18px;font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
html[lang=ar] .est .k{letter-spacing:0;font-size:13px;text-transform:none}
.ln{display:flex;justify-content:space-between;gap:14px;font-size:14px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.ln span:first-child{min-width:0}
.ln em{font-style:normal;color:var(--muted);font-size:12px;display:block}
.ln b{white-space:nowrap}
.tag-inc{background:var(--green);color:var(--blue);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;align-self:center;white-space:nowrap}
.tag-cf{color:var(--muted);font-size:12px;white-space:nowrap;align-self:center}
.sumrow{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:8px}
.total{margin-top:16px;padding-top:16px;border-top:2px solid var(--blue)}
.total .l{font-size:14px;color:var(--muted)}
.total .a{font-size:40px;font-weight:700;color:var(--blue);line-height:1.15;margin-top:2px}
.total .a small{font-size:18px;font-weight:600;margin-inline-start:6px}
.est .fine{margin-top:10px;font-size:12px;line-height:1.6;color:var(--muted)}
.est .btn-primary{margin-top:20px;min-height:54px}
.est .btn-secondary{margin-top:10px}
.est .center{text-align:center;margin-top:4px}
.empty{font-size:14px;color:var(--muted);padding:12px 0}

/* ---------- footer ---------- */
footer{background:#fff;border-top:1px solid var(--line);padding:44px 0 120px}
.ft{display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.ft img{width:110px;height:auto}
.ft p{margin:0;font-size:13px;color:var(--muted);line-height:1.8}

/* ---------- mobile bar / sheet / modal ---------- */
#mbar{display:none;position:fixed;inset-inline:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(9,25,78,.1);padding:10px 16px calc(10px + env(safe-area-inset-bottom));align-items:center;justify-content:space-between;gap:12px}
#mbar .l{font-size:12px;color:var(--muted)}
#mbar .a{font-size:24px;font-weight:700;color:var(--blue);line-height:1.2}
.ov{position:fixed;inset:0;background:rgba(9,25,78,.6);z-index:60;display:none}
.ov.show{display:block}
.sheet{position:absolute;inset-inline:0;bottom:0;max-height:92vh;background:#fff;border-radius:20px 20px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 6px}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.x{width:44px;height:44px;border-radius:50%;border:0;background:#F1F2F6;color:var(--blue);display:inline-flex;align-items:center;justify-content:center}
.modal{position:absolute;top:50%;inset-inline:0;margin:0 auto;transform:translateY(-50%);width:min(520px,calc(100% - 32px));max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:28px}
.modal h2{margin:0;color:var(--blue);font-size:26px;font-weight:600}
.modal p{color:#3E4560;font-size:15px}
.modal .fld{margin-top:16px}
.err{color:#B3261E;font-size:13px;margin-top:6px}
#toast{position:fixed;inset-inline:0;bottom:110px;margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--blue);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #aside{display:none}
  .tabs{display:none}
  .mprog{display:block}
  #mbar{display:flex}
  .hero-in{flex-direction:column;min-height:0}
  .hero-copy{flex:none;padding:36px 20px 28px}
  .hero-logo{width:120px;margin-bottom:24px}
  .hero-img{flex:none;height:260px;min-height:0}
  .hero-img::after,html[dir=rtl] .hero-img::after{background:linear-gradient(to bottom,var(--blue) 0%,rgba(9,25,78,0) 40%)}
  .sec-h{padding:18px 18px}
  .sec-body{padding:2px 18px 22px}
  .sec-s .tx{display:none}
  .fields{grid-template-columns:1fr}
  .radios{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .checks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f-top{flex-direction:column;gap:12px}
  .featured{padding:20px}.featured.on{padding:19px}
}
@media (max-width:420px){ .sec-s .sub-s{display:none} .total .a{font-size:34px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- added in revision 2 ---------- */
.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.contact .fld.wide{grid-column:span 1}
.err{color:#B3261E;font-size:13px;margin-top:6px}
.inp.bad{border-color:#B3261E}
.seatopt{display:flex;flex-direction:column;gap:2px}
.seatopt b{font-weight:700}
.seatopt small{font-size:12px;font-weight:500;color:var(--muted)}
.radio input:checked+span .seatopt small{color:var(--blue)}
.radio>input+span{min-height:64px;padding-block:10px}
.mcat{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:#fff;width:100%;text-align:start;transition:border-color .2s,background .2s}
.mcat[aria-pressed=true]{border:2px solid var(--blue);padding:15px 17px;background:var(--green-soft)}
.mcat[aria-pressed=false]{background:#F3F4F7;color:#7A8094;border-color:#E3E5EB}
.mcat .bx{width:26px;height:26px;border-radius:6px;border:1.5px solid #8a90a3;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px;background:#fff;color:#fff}
.mcat[aria-pressed=true] .bx{background:var(--blue);border-color:var(--blue)}
.mcat .mt{font-weight:700;color:var(--blue);font-size:16px}
.mcat[aria-pressed=false] .mt{color:#6B7285}
.mcat[aria-pressed=false] .mp{color:#7A8094}
.mcat[aria-pressed=false] .bx{background:#fff;border-color:#B5BAC8}
.mcat .md{font-size:14px;line-height:1.7;margin-top:4px}
.mcat .mp{margin-inline-start:auto;font-weight:700;color:var(--blue);white-space:nowrap;font-size:15px;padding-inline-start:12px}
.mcat .mp.cf{font-weight:500;font-size:12px;color:var(--muted)}
.menu-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.legal{background:#fff;border-top:1px solid var(--line);padding:26px 0}
.legal p{margin:0;max-width:980px;margin-inline:auto;padding:0 clamp(16px,4vw,64px);font-size:13px;line-height:1.9;color:var(--muted)}
.legal b{color:var(--blue)}
footer{padding:36px 0 120px;border-top:0}
.ln .d{display:block;font-size:12px;color:var(--muted);font-style:normal;line-height:1.5;margin-top:2px}
.ln .p{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ln .p small{font-size:11px;color:var(--muted);font-weight:500}
.total2{margin-top:10px;padding:12px 14px;background:var(--green-soft);border-radius:10px;font-size:14px;display:flex;justify-content:space-between;color:var(--blue);font-weight:600}
@media (max-width:980px){ .contact{grid-template-columns:1fr} #aside{max-height:none} }

.hall{margin-top:18px}
.hall svg{direction:ltr;display:block;width:100%;height:auto;max-width:340px;margin:8px auto 0;background:#fff;border-radius:18px}
.hall .hw{fill:#FBFBF8;stroke:var(--blue);stroke-width:2}
.hall .hst{fill:var(--blue)} .hall .hlb{font-size:11px;font-weight:600;fill:var(--muted);font-family:inherit} .hall .hlb.w{fill:#fff}
.hall .hai{fill:#EEF3E2;stroke:var(--green-line);stroke-width:1;stroke-dasharray:3 4}
.hall .hf2{fill:#fff;stroke:var(--blue);stroke-width:1.2}
.hall .hp{fill:#E8C9C4;stroke:var(--blue);stroke-width:1.2}
.hall .hfl{fill:var(--green-line)}
.hall .hdr{fill:var(--green-line)}
.hall .ht{fill:var(--green);stroke:var(--blue);stroke-width:1.5}
.hall .hs{fill:var(--blue)} .hall .hs.e{fill:#fff;stroke:var(--grey);stroke-width:1}
.hall .hf{fill:var(--green);stroke:var(--blue);stroke-width:1.4}
.hall .hcap{text-align:center;margin-top:10px;color:var(--blue);font-size:15px}
.hall .hint{text-align:center;margin-top:4px}
.hall.pop .hu{transform-box:fill-box;transform-origin:center;animation:hpop .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes hpop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.hall.pop .hu{animation:none}}
.hl{margin:14px 0 0;font-size:14px;color:var(--muted);line-height:1.8}
.mcw{display:flex;flex-direction:column;gap:8px}
.mopts{display:flex;flex-wrap:wrap;gap:8px;margin-inline-start:40px}
.mopt{min-height:44px;border:1px solid #8a90a3;background:#fff;border-radius:999px;padding:0 20px;font-size:14px;cursor:pointer;color:var(--ink)}
.mopt[aria-checked=true]{background:var(--green);border:2px solid var(--blue);color:var(--blue);font-weight:700}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 24px;border:1.5px solid rgba(255,255,255,.75);border-radius:10px;color:#fff;text-decoration:none;font-weight:600;background:transparent}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-ghost .i{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6}
.ftl{color:var(--blue);font-weight:600;text-decoration:underline;display:inline-block;margin-top:6px}
</style>

const fm = n => (Math.round(n*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});

function tierFor(tiers){ for(const x of tiers){ if(S.guests<=x.n) return x; } return tiers[tiers.length-1]; }

function amountOf(id){
  if(!isOn(id)) return null; const s=SVC[id];
  if(s.type==="toggle") return s.price;
  if(s.type==="qty") return s.price*qtyOf(id);
  if(s.type==="tier") return tierFor(s.tiers).price;
  if(s.type==="pkgsel") return s.opts[S.hot].price;

}
const amberIncluded = () => S.guests>=50;

function lines(){
  const out=[]; const l=L();
  const push=(sec,name,amount,kind,desc,sub)=>out.push({sec,name,amount,kind,desc:desc||"",sub:sub||null});
  const add=id=>{
    if(!isOn(id)) return; const s=SVC[id]; const a=amountOf(id);
    let nm=t(s.name), d=t(s.desc);
    if(s.type==="qty"){ nm += ` × ${qtyOf(id)}`; }
    if(s.type==="tier"){ d = t(s.desc); }
    if(s.type==="pkgsel"){ d = `${t(s.opts[S.hot].label)} — ${t(s.opts[S.hot].items)}`; }
    push(s.sec,nm,a,"priced",d);
  };
  if(isOn("decor")){ const n0=out.length; add("decor"); if(out.length>n0) out[n0].desc=t(SVC.decor.desc); }
  if(S.seat==="round") push("decor", l.round, null, "included", l.roundNote);
  if(S.seat==="sofa"){ const st=sofaTier(); push("decor", (LANG==="ar"?"جلسات الكنب":"Sofa Seating"), st.price, "priced", ""); }
  ["powder","sweets","perfume"].forEach(add);
  push("team", l.secFull.team, null, "included", l.stdTeamIncl);
  Object.keys(STAFF.extra).forEach(k=>{ const n=S.staff[k]; if(n>0){ const e=STAFF.extra[k]; push("team", `${t(e.name)} × ${n}`, e.price*n, "priced", t(e.desc)); } });
  ["drink","hotbev","plate","tray"].forEach(add);
  ["photo","booth","p360"].forEach(add);
  /* dinner */
  const dc=dinnerCats(), picked=dc.filter(x=>x.on);
  if(picked.length){
    const sum=picked.reduce((a,x)=>a+x.price,0);
    const desc=l.catsSel(picked.length,dc.length);
    push("dinner", l.dinnerFor(), sum, "priced", desc, picked.map(x=>t(x.c.name)+(x.c.opts?" — "+t(x.c.opts[S.mopt[x.c.id]||0]):"")));
  }
  ["lamb","jareesh","qursan"].forEach(add);
  ["coffee","fountain","voice","laser","led","dj"].forEach(add);
  push("included", LANG==="ar"?"جناح العروسين":"Newlyweds' Suite", null, "included","");
  if(amberIncluded()) push("included", LANG==="ar"?"قاعة عنبر":"Amber Hall", null, "included", l.suiteNote);
  push("included", LANG==="ar"?"مواقف السيارات":"Parking", null, "complimentary", l.parkNote);
  return out;
}
function totals(){
  const sub = lines().reduce((a,x)=>a+(x.kind==="priced"&&x.amount!=null?x.amount:0),0);
  const subR = Math.round(sub), total = Math.round(sub*(1+VAT));
  return {sub:subR, vat:total-subR, total};
}

  const card=x=>{
    const o=x.c.opts, cur=S.mopt[x.c.id]||0;
    const btn=`<button class="mcat" aria-pressed="${x.on}" data-act="menu" data-id="${x.c.id}" data-fk="mc-${x.c.id}">
      <span class="bx">${x.on?IC.check:""}</span><span style="min-width:0;flex:1"><span style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><span class="mt">${t(x.c.name)}</span><span class="mp" style="padding:0">${money(x.price)}</span></span><span class="md" style="display:block">${t(x.c.desc)}</span></span></button>`;
    const opts = (o&&x.on)?`<div class="mopts" role="radiogroup" aria-label="${t(x.c.name)}">${o.map((z,i)=>`<button class="mopt" role="radio" aria-checked="${i===cur}" data-act="mopt" data-id="${x.c.id}" data-i="${i}" data-fk="mo-${x.c.id}-${i}">${t(z)}</button>`).join("")}</div>`:"";
    return `<div class="mcw">${btn}${opts}</div>`;
  };
  const cats = DINNER_GROUPS.map(g=>`<div class="group-t head" style="margin:14px 0 2px">${t(g.name)}</div>`+dc.filter(x=>x.c.g===g.id).map(card).join("")).join("");
  const head = `<div class="featured on"><div class="f-top"><div><h3 class="head">${l.dinnerFor()}</h3><p>${l.dinnerDesc}</p></div></div>
    
    <div class="menu-list">${cats}</div><div class="hint" style="margin-top:12px">${l.breadNote}</div></div>`;
  const addons = `<div class="acc ${S.addonsOpen?"open":""}"><button data-act="addons" data-fk="addons" aria-expanded="${!!S.addonsOpen}">${l.dinnerAddons}${IC.chev}</button>
    <div class="acc-b"><div class="grid2" style="margin-top:4px">${["lamb","jareesh","qursan"].map(compact).join("")}</div></div></div>`;
  const picked=dc.filter(x=>x.on), sum=picked.reduce((a,x)=>a+x.price,0), ad=["lamb","jareesh","qursan"].reduce((a,i)=>a+(amountOf(i)||0),0);
  const stt=`<span class="tx">${l.catsSel(picked.length,dc.length)}${sum+ad?` · ${money(sum+ad)}`:""}</span>`;
  return secWrap("dinner","05",stt,head+addons);
}
function addonsSec(){
  const l=L(); const ids=["coffee","fountain","voice","laser","led","dj"];
  const cnt=ids.filter(isOn).length, amt=ids.reduce((a,i)=>a+(amountOf(i)||0),0);
  const stt = cnt?`<span class="tx">${l.svcSel(cnt)} · ${money(amt)}</span>`:`<span class="tx">${l.notSelected}</span>`;
  return secWrap("addons","06",stt,`<div class="grid2">${ids.map(compact).join("")}</div>`);
}
function includedSec(){
  const l=L();
  const row=(nm,note)=>`<div class="inc-row"><span class="ic">${IC.check}</span><div><div style="font-weight:600;color:var(--blue);font-size:17px">${nm}</div><div class="hint">${note}</div></div></div>`;
  const body = `<div class="benefit" style="display:grid;gap:18px">${row(LANG==="ar"?"جناح العروسين":"Newlyweds' Suite",l.suiteNote)}${amberIncluded()?row(LANG==="ar"?"قاعة عنبر":"Amber Hall",l.suiteNote):""}${row(LANG==="ar"?"مواقف السيارات":"Parking",l.parkNote)}</div>`;
  const nb=amberIncluded()?3:2;
  return secWrap("included","07",`<span class="tx">${LANG==="ar"?(nb===2?"مزيتان":nb+" مزايا"):nb+" benefits"}</span>`,body);
}
function tagFor(x){
  const l=L();
  if(x.kind==="priced") return `<b>${money(x.amount)}</b>`;
  if(x.kind==="complimentary") return `<span class="tag-inc">${l.complimentary}</span>`;
  if(x.kind==="included") return `<span class="tag-inc">${LANG==="ar"&&x.name.indexOf("عنبر")>-1?l.includedF:l.included}</span>`;
  return `<span class="tag-cf">${l.onConfirm}</span>`;
}
function summaryBody(){
  const l=L(), ls=lines(), tt=totals();
  const rows = ls.map(x=>`<div class="ln"><span>${esc(x.name)}${x.desc?`<span class="d">${esc(x.desc)}</span>`:""}</span><span class="p">${tagFor(x)}${x.kind==="priced"?`<small>${l.beforeVat}</small>`:""}</span></div>`).join("");
  return `<div>${rows}</div>
   <div class="sumrow"><span>${l.subtotal}</span><span>${money(tt.sub)}</span></div><div class="sumrow"><span>${l.vatL}</span><span>${money(tt.vat)}</span></div>
   <div class="total"><div class="l">${l.total}</div><div class="a">${fm(tt.total)}<small>${l.sar}</small></div></div>${ls.some(x=>x.kind==="confirm")?`<div class="fine">${l.fine}</div>`:""}`;
}
function actions(){
  const l=L();
  return `<button class="btn btn-primary btn-block" data-act="wa" data-fk="wa">${IC.wa}${l.waBtn}</button>
   <button class="btn btn-secondary btn-block" data-act="mail" data-fk="mail">${IC.mail}${l.mailBtn}</button>
   <div class="center"><button class="btn-text" data-act="reset" data-fk="reset">${l.reset}</button></div>`;
}
function summarySec(){
  const l=L(), tt=totals();
  const body=`<div class="est" style="border:0;padding:0"><div class="g" style="margin-top:0">${S.guests} ${l.guestUnit}</div>${summaryBody()}${actions()}</div>`;
  return secWrap("summary","",`<span class="tx">${money(tt.total)}</span>`,body);
}
function celebSec(){
  const l=L(), c=S.contact, bad=S.cerr;
  const nameBad = bad && !c.name.trim(), phoneBad = bad && !validPhone();
  const body=`<div class="contact">
      <div class="fld"><label class="lbl" for="cName">${l.fName} *</label><div class="inp ${nameBad?"bad":""}">${IC.user}<input id="cName" data-field="name" autocomplete="name" value="${esc(c.name)}" required aria-invalid="${nameBad}"></div>${nameBad?`<div class="err">${l.eName}</div>`:""}</div>
      <div class="fld"><label class="lbl" for="cPhone">${l.fPhone} *</label><div class="inp ${phoneBad?"bad":""}">${IC.phone}<input id="cPhone" data-field="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" value="${esc(c.phone)}" required aria-invalid="${phoneBad}"></div>${phoneBad?`<div class="err">${l.ePhone}</div>`:""}</div>
      <div class="fld"><label class="lbl" for="cEmail">${l.fEmail} <small>· ${l.optional}</small></label><div class="inp">${IC.mail}<input id="cEmail" data-field="email" type="email" autocomplete="email" dir="ltr" value="${esc(c.email)}"></div></div></div>
    <div class="fields"><div class="fld"><div class="lbl" id="gl">${l.guests}</div>
      <div class="stepper" role="group" aria-labelledby="gl"><button class="sbtn" data-act="guests" data-d="-5" data-fk="g-m" aria-label="${LANG==="ar"?"إنقاص":"Decrease"}">${IC.minus}</button>
      <label class="inp" style="width:130px">${IC.users}<input id="guestsIn" type="number" inputmode="numeric" min="10" max="100" value="${S.guests}" aria-labelledby="gl" data-fk="g-in"></label>
      <button class="sbtn pl" data-act="guests" data-d="5" data-fk="g-p" aria-label="${LANG==="ar"?"زيادة":"Increase"}">${IC.plus}</button></div>
      <div class="hint" style="margin-top:8px">${l.guestHint}</div></div>
    <div class="fld"><label for="dateIn" class="lbl">${l.date} <small>· ${l.optional}</small></label><div class="inp">${IC.cal}<input id="dateIn" type="date" value="${S.date}" data-fk="d-in"></div></div></div>`;
  return secWrap("celebration","",`<span class="tx">${S.guests} ${l.guestUnit}${S.date?` · ${S.date}`:""}</span>`,body);
}
function renderCfg(){
  document.getElementById("cfg").innerHTML = celebSec()+decorSec()+teamSec()+hospSec()+photoSec()+dinnerSec()+addonsSec()+includedSec()+summarySec();
}
function renderAside(){
  const l=L();
  document.getElementById("aside").innerHTML = `<div class="est"><h2 class="head">${l.est}</h2><div class="g">${S.guests} ${l.guestUnit}</div><div class="k">${l.yourSel}</div>${summaryBody()}${actions()}</div>`;
}
function renderMbar(){
  const l=L(), tt=totals();
  document.getElementById("mbar").innerHTML = `<div><div class="l">${l.total}</div><div class="a">${money(tt.total)}</div></div><button class="btn btn-primary" data-act="sheet" data-fk="sheet">${l.viewSum}</button>`;
}
function renderFoot(){
  const l=L();
  document.getElementById("legal").innerHTML = `<p>${l.legal}</p>`;
  document.getElementById("foot").innerHTML = `<div class="wrap ft"><img src="${LOGO_NAVY}" alt="${BRAND[LANG]}"><p><b style="color:var(--blue)">${BRAND[LANG]}</b><br>${l.footAddr}<br><a class="ftl" href="${CONFIG.brochure[LANG]}" target="_blank" rel="noopener" data-act="brochure">${l.brochureBtn}</a></p></div>`;
}
function renderSheet(){
  const ov=document.getElementById("ovSheet"); const l=L();
  if(!UIS.sheet){ ov.classList.remove("show"); ov.innerHTML=""; return; }
  ov.classList.add("show");
  ov.innerHTML = `<div class="sheet"><div class="grab"></div><div class="sheet-h"><h2 id="sheetT" class="head" style="margin:0;color:var(--blue);font-size:22px">${l.est}</h2>
    <button class="x" data-act="sheetClose" data-fk="sheetx" aria-label="${l.close}">${IC.x}</button></div><div class="hint" style="margin-bottom:4px">${S.guests} ${l.guestUnit}</div>
    <div class="est" style="border:0;padding:0">${summaryBody()}${actions()}</div></div>`;
}

let _fk=null;
function renderAll(){
  const ae=document.activeElement; _fk = ae && ae.dataset ? ae.dataset.fk : null;
  const y=window.scrollY; const l=L();
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==="ar"?"rtl":"ltr"; document.title=l.title;
  renderBar(); renderHero(); renderCfg(); renderAside(); renderMbar(); renderFoot(); renderSheet();
  window.scrollTo({top:y,behavior:'instant'});
  if(_fk){ const el=document.querySelector(`[data-fk="${_fk}"]`); if(el && !el.disabled) el.focus({preventScroll:true}); }
  document.body.style.overflow=UIS.sheet?"hidden":"";
}
const refresh = renderAll;

/* ======================================================================
   ACTIONS
   ====================================================================== */
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2600); }
function setOpen(id,v){ S.open[id]=v; const el=document.getElementById("s_"+id); if(el){ el.classList.toggle("open",v); const b=el.querySelector(".sec-h"); if(b) b.setAttribute("aria-expanded",v);} }
function markViewed(id){ if(!S.viewed[id]){ S.viewed[id]=true; track("category_completed",{category:id}); return true; } return false; }
function goto(id){ setOpen(id,true); markViewed(id); S.cur=SECS.indexOf(id); renderBar(); const el=document.getElementById("s_"+id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }
function validPhone(){ return S.contact.phone.replace(/\D/g,"").length>=9; }
function contactOk(){
  if(S.contact.name.trim() && validPhone()) { S.cerr=false; return true; }
  S.cerr=true; UIS.sheet=false; setOpen("celebration",true); renderAll();
  const el=document.getElementById(!S.contact.name.trim()?"cName":"cPhone"); document.getElementById("s_celebration").scrollIntoView({behavior:"smooth",block:"start"}); if(el) setTimeout(()=>el.focus({preventScroll:true}),350);
  toast(L().needContact); return false;
}


function msgBody(md){
  const l=L(), ls=lines(), tt=totals(), c=S.contact, b=BRAND[LANG]; const B=x=>md?`*${x}*`:x;
  const bullet = x => `• ${x.name} — ${x.kind==="priced"?money(x.amount):x.kind==="complimentary"?l.complimentary:x.kind==="included"?(LANG==="ar"&&x.name.indexOf("عنبر")>-1?l.includedF:l.included):l.onConfirm}`+(x.sub?`\n    (${x.sub.join(LANG==="ar"?"، ":", ")})`:"");
  let s = `${B(l.waTitle)}\n${b}\n\n${B(l.waName)}: ${c.name.trim()}\n${B(l.waPhone)}: ${c.phone.trim()}\n`+(c.email.trim()?`${B(l.waEmail)}: ${c.email.trim()}\n`:"")+(S.date?`${B(l.waDate)}: ${S.date}\n`:"")+
    `${B(l.waGuests)}: ${S.guests}\n${B(l.waSeat)}: ${S.seat==="round"?l.round:S.seat==="sofa"?l.sofa:"—"}\n\n${B(l.waSel)}:\n${ls.map(bullet).join("\n")}\n\n`+
    `${l.subtotal}: ${money(tt.sub)}\n${l.vatL}: ${money(tt.vat)}\n${B(l.total)}: ${money(tt.total)}\n\n${md?"_":""}${l.waNote}${md?"_":""}`;
  return s;
}
function shareWA(){ if(!contactOk()) return; track("whatsapp_shared"); window.open(`https://wa.me/${CONFIG.hotelWhatsApp}?text=`+encodeURIComponent(msgBody(true)),"_blank","noopener"); }
function shareMail(){ if(!contactOk()) return; track("email_shared"); window.location.href=`mailto:${CONFIG.hotelEmail}?subject=${encodeURIComponent(L().mailSubj)}&body=${encodeURIComponent(msgBody(false))}`; }

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="lang"){ LANG=LANG==="ar"?"en":"ar"; track("language_changed",{language:LANG}); renderAll(); return; }
  if(a==="begin"){ startedOnce(); goto("celebration"); return; }
  if(a==="nav"){ goto(id); return; }
  if(a==="sec"){ const v=!S.open[id]; setOpen(id,v); if(v) markViewed(id); renderBar(); return; }
  if(a==="details"){ S.details[id]=!S.details[id]; renderCfg(); return; }
  if(a==="addons"){ S.addonsOpen=!S.addonsOpen; const acc=el.closest(".acc"); acc.classList.toggle("open",S.addonsOpen); el.setAttribute("aria-expanded",S.addonsOpen); return; }
  if(a==="menuPdf"){ track("menu_viewed"); return; }
  if(a==="sheetClose"){ UIS.sheet=false; renderSheet(); document.body.style.overflow=""; return; }
  startedOnce();
  if(a==="toggle"){ const was=!!S.on[id]; S.on[id]=!was; track(was?"service_removed":"service_selected",{service_id:id}); refresh(); return; }
  if(a==="mopt"){ S.mopt[el.dataset.id]=+el.dataset.i; track("service_selected",{service_id:"menu-opt-"+el.dataset.id+"-"+el.dataset.i}); refresh(); return; }
  if(a==="menu"){ const c=DINNER_CATS.find(z=>z.id===id); S.menu[id]=!S.menu[id]; if(S.menu[id]&&c.ex) DINNER_CATS.forEach(z=>{ if(z.ex===c.ex&&z.id!==id) S.menu[z.id]=false; }); track(S.menu[id]?"service_selected":"service_removed",{service_id:"menu-"+id}); refresh(); return; }
  if(a==="qty"){
    const d=+el.dataset.d;
    if(id.startsWith("staff-")){ const k=id.slice(6); S.staff[k]=Math.max(0,Math.min(STAFF.extra[k].max,S.staff[k]+d)); track(d>0?"service_selected":"service_removed",{service_id:id}); refresh(); return; }
    const s=SVC[id]; S.qty[id]=Math.max(s.min,Math.min(s.max,qtyOf(id)+d*s.step)); refresh(); return; }
  if(a==="staff"){ S.staff[el.dataset.k]=Math.max(0,S.staff[el.dataset.k]+1); track("service_selected",{service_id:"staff-"+el.dataset.k}); refresh(); return; }
  if(a==="guests"){ setGuests(S.guests+ +el.dataset.d); return; }
  if(a==="sheet"){ UIS.sheet=true; renderSheet(); document.body.style.overflow="hidden"; const b=document.querySelector("#ovSheet .x"); if(b) b.focus(); return; }
  if(a==="wa"){ shareWA(); return; }
  if(a==="mail"){ shareMail(); return; }
  if(a==="reset"){ S=freshState(); UIS.sheet=false; refresh(); toast(L().cleared); window.scrollTo({top:0,behavior:"smooth"}); return; }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.act==="seat"){ S.seat=el.checked?el.value:null; track(el.checked?"service_selected":"service_removed",{service_id:"seat-"+el.value}); refresh(); }
  else if(el.dataset.act==="hot"){ S.hot=el.value; S.on.hotbev=true; refresh(); }
  else if(el.id==="guestsIn"){ setGuests(parseInt(el.value,10)||S.guests); }
  else if(el.id==="dateIn"){ S.date=el.value; renderCfg(); renderAside(); }
});
document.addEventListener("input",e=>{ const el=e.target; if(el.dataset && el.dataset.field){ S.contact[el.dataset.field]=el.value; if(S.cerr && S.contact.name.trim() && validPhone()){ S.cerr=false; } } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && UIS.sheet){ UIS.sheet=false; renderSheet(); document.body.style.overflow=""; } });
function setGuests(n){
  n=Math.max(10,Math.min(100,Math.round(n)||S.guests)); if(n===S.guests){ refresh(); return; }
  S.guests=n; track("guest_count_selected",{guests:n}); refresh();
}

/* section tracking while scrolling */
let _tick=false;
function onScroll(){
  if(_tick) return; _tick=true;
  requestAnimationFrame(()=>{ _tick=false;
    let cur=0, changed=false;
    SECS.forEach((id,i)=>{ const el=document.getElementById("s_"+id); if(!el) return; const r=el.getBoundingClientRect();
      if(r.top<=window.innerHeight*0.35){ cur=i; }
      if(r.top<window.innerHeight*0.6 && r.bottom>0 && !S.viewed[id] && i<=cur){ markViewed(id); changed=true; } });
    if(cur!==S.cur){ S.cur=cur; changed=true; }
    if(changed) renderBar();
  });
}
window.addEventListener("scroll",onScroll,{passive:true});

renderAll();

</script></body></html>
